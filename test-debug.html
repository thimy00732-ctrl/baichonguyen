<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Login - AlumniNet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { margin-bottom: 30px; color: #333; }
    .test-section { background: white; padding: 24px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .test-section h2 { font-size: 18px; margin-bottom: 16px; color: #0A66C2; }
    .result { margin-top: 12px; padding: 12px; border-radius: 6px; font-size: 14px; line-height: 1.6; }
    .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    .warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
    .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    button { padding: 10px 20px; background: #0A66C2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    button:hover { background: #084d8f; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    pre { background: #f8f9fa; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    .status-dot.green { background: #28a745; }
    .status-dot.red { background: #dc3545; }
    .status-dot.yellow { background: #ffc107; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 AlumniNet Login Debug Tool</h1>

    <!-- Test 1: Check Files Loaded -->
    <div class="test-section">
      <h2>Test 1: Check JavaScript Files Loaded</h2>
      <button onclick="test1()">Run Test</button>
      <div id="result1"></div>
    </div>

    <!-- Test 2: Check Functions Exist -->
    <div class="test-section">
      <h2>Test 2: Check Required Functions</h2>
      <button onclick="test2()">Run Test</button>
      <div id="result2"></div>
    </div>

    <!-- Test 3: Test API Connection -->
    <div class="test-section">
      <h2>Test 3: Test Server Connection</h2>
      <button onclick="test3()">Run Test</button>
      <div id="result3"></div>
    </div>

    <!-- Test 4: Test Login API -->
    <div class="test-section">
      <h2>Test 4: Test Login API Directly</h2>
      <input type="email" id="testEmail" placeholder="Email" value="admin@alumnet.edu.vn">
      <input type="password" id="testPass" placeholder="Password" value="admin123">
      <button onclick="test4()">Test Login</button>
      <div id="result4"></div>
    </div>

    <!-- Test 5: Test with dangNhap Function -->
    <div class="test-section">
      <h2>Test 5: Test dangNhap() Function</h2>
      <button onclick="test5()">Run dangNhap()</button>
      <div id="result5"></div>
    </div>

    <!-- Test 6: Check DOM Elements -->
    <div class="test-section">
      <h2>Test 6: Check DOM Elements Exist</h2>
      <button onclick="test6()">Run Test</button>
      <div id="result6"></div>
    </div>

    <!-- Test 7: Full Integration Test -->
    <div class="test-section">
      <h2>Test 7: Full Login Flow Simulation</h2>
      <button onclick="test7()">Run Full Test</button>
      <div id="result7"></div>
    </div>
  </div>

  <!-- Load Scripts -->
  <script src="/js/api.js?v=20261121999"></script>
  <script src="/js/app.js?v=20261121999"></script>

  <script>
    function showResult(id, html, type = 'info') {
      const el = document.getElementById(id);
      el.innerHTML = `<div class="result ${type}">${html}</div>`;
    }

    function test1() {
      showResult('result1', '⏳ Checking...', 'info');
      
      const checks = [
        { name: 'api.js loaded', test: typeof goiAPI !== 'undefined' },
        { name: 'app.js loaded', test: typeof dangNhap !== 'undefined' },
        { name: 'Scripts version', test: true, value: 'v=20261121999' }
      ];

      let html = '<ul style="margin:0;padding-left:20px">';
      let allPassed = true;

      checks.forEach(check => {
        const passed = check.test;
        const dot = passed ? '🟢' : '🔴';
        html += `<li>${dot} ${check.name}: ${passed ? '✓ Pass' : '✗ Fail'}${check.value ? ` (${check.value})` : ''}</li>`;
        if (!passed) allPassed = false;
      });

      html += '</ul>';
      showResult('result1', html, allPassed ? 'success' : 'error');
    }

    function test2() {
      showResult('result2', '⏳ Checking...', 'info');

      const functions = [
        'goiAPI', 'dangNhapAPI', 'dangKyAPI', 'layThongTinToiAPI',
        'dangNhap', 'dangKy', 'dangXuat', 'chuyenForm',
        'hienTrang', 'hienToast', 'kiemTraXacThuc'
      ];

      let html = '<ul style="margin:0;padding-left:20px">';
      let allExist = true;

      functions.forEach(fn => {
        const exists = typeof window[fn] === 'function';
        const dot = exists ? '🟢' : '🔴';
        html += `<li>${dot} ${fn}: ${exists ? '✓ Exists' : '✗ Missing'}</li>`;
        if (!exists) allExist = false;
      });

      html += '</ul>';
      showResult('result2', html, allExist ? 'success' : 'error');
    }

    async function test3() {
      showResult('result3', '⏳ Testing connection...', 'info');

      try {
        const response = await fetch('/api/admin/statistics');
        const data = await response.json();

        const html = `
          <strong>✓ Server connected!</strong><br>
          Status: ${response.status} ${response.statusText}<br>
          Response:<br>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
        showResult('result3', html, 'success');
      } catch (error) {
        showResult('result3', `<strong>✗ Connection failed!</strong><br>Error: ${error.message}`, 'error');
      }
    }

    async function test4() {
      showResult('result4', '⏳ Testing login API...', 'info');

      const email = document.getElementById('testEmail').value;
      const pass = document.getElementById('testPass').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });

        const data = await response.json();

        if (data.token) {
          const html = `
            <strong>✓ Login API Success!</strong><br>
            Token: ${data.token.substring(0, 30)}...<br>
            User: ${data.user?.email || 'N/A'}<br>
            Roles: ${data.user?.roles?.join(', ') || 'N/A'}<br>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
          showResult('result4', html, 'success');
        } else {
          showResult('result4', `<strong>✗ Login failed!</strong><br>${data.message}<br><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
        }
      } catch (error) {
        showResult('result4', `<strong>✗ Request failed!</strong><br>Error: ${error.message}`, 'error');
      }
    }

    async function test5() {
      showResult('result5', '⏳ Testing dangNhap() function...', 'info');

      // Set values in DOM
      const emailInput = document.createElement('input');
      emailInput.id = 'emailDangNhap';
      emailInput.value = 'admin@alumnet.edu.vn';
      document.body.appendChild(emailInput);

      const passInput = document.createElement('input');
      passInput.id = 'matKhauDangNhap';
      passInput.value = 'admin123';
      document.body.appendChild(passInput);

      try {
        if (typeof dangNhap === 'function') {
          await dangNhap();
          
          const token = localStorage.getItem('token');
          if (token) {
            showResult('result5', `<strong>✓ dangNhap() Success!</strong><br>Token stored: ${token.substring(0, 30)}...`, 'success');
          } else {
            showResult('result5', '<strong>⚠ dangNhap() ran but no token stored</strong>', 'warning');
          }
        } else {
          showResult('result5', '<strong>✗ dangNhap() function not found!</strong>', 'error');
        }
      } catch (error) {
        showResult('result5', `<strong>✗ dangNhap() threw error!</strong><br>Error: ${error.message}<br><pre>${error.stack}</pre>`, 'error');
      } finally {
        document.body.removeChild(emailInput);
        document.body.removeChild(passInput);
      }
    }

    function test6() {
      showResult('result6', '⏳ Checking DOM...', 'info');

      const elements = [
        'emailDangNhap',
        'matKhauDangNhap',
        'formDangNhap',
        'formDangKy',
        'trang-auth',
        'ungDung',
        'toast'
      ];

      let html = '<ul style="margin:0;padding-left:20px">';
      let allExist = true;

      elements.forEach(id => {
        const exists = document.getElementById(id) !== null;
        const dot = exists ? '🟢' : '🔴';
        html += `<li>${dot} #${id}: ${exists ? '✓ Exists' : '✗ Missing'}</li>`;
        if (!exists) allExist = false;
      });

      html += '</ul>';
      showResult('result6', html, allExist ? 'success' : 'warning');
    }

    async function test7() {
      showResult('result7', '⏳ Running full integration test...', 'info');

      const steps = [];
      
      try {
        // Step 1: Check functions
        steps.push({ name: 'Functions exist', pass: typeof dangNhap === 'function' && typeof dangNhapAPI === 'function' });

        // Step 2: Test API connection
        const statsRes = await fetch('/api/admin/statistics');
        steps.push({ name: 'Server connection', pass: statsRes.ok });

        // Step 3: Test login API
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'admin@alumnet.edu.vn', password: 'admin123' })
        });
        const loginData = await loginRes.json();
        steps.push({ name: 'Login API response', pass: !!loginData.token });

        // Step 4: Store token
        if (loginData.token) {
          localStorage.setItem('token', loginData.token);
          steps.push({ name: 'Token storage', pass: true });
        } else {
          steps.push({ name: 'Token storage', pass: false });
        }

        // Step 5: Test /me endpoint
        const meRes = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${loginData.token}` }
        });
        steps.push({ name: '/me endpoint', pass: meRes.ok });

        // Generate report
        let html = '<strong>Integration Test Results:</strong><ul style="margin:8px 0;padding-left:20px">';
        let allPassed = true;

        steps.forEach(step => {
          const dot = step.pass ? '🟢' : '🔴';
          html += `<li>${dot} ${step.name}: ${step.pass ? 'PASS' : 'FAIL'}</li>`;
          if (!step.pass) allPassed = false;
        });

        html += '</ul>';

        if (allPassed) {
          html += '<br><strong style="color:#28a745">✓ ALL TESTS PASSED! Login should work!</strong>';
        } else {
          html += '<br><strong style="color:#dc3545">✗ Some tests failed. Check above for details.</strong>';
        }

        showResult('result7', html, allPassed ? 'success' : 'error');

      } catch (error) {
        showResult('result7', `<strong>✗ Test failed with error!</strong><br>${error.message}<br><pre>${error.stack}</pre>`, 'error');
      }
    }

    // Auto-run basic tests on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        test1();
        test2();
      }, 500);
    });
  </script>
</body>
</html>
